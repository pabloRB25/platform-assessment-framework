# Configuración de Ponderaciones y Umbrales del Assessment
framework_version: "2.0.0"
author: "Studio Architecture & Quality Practice"

scoring_scale:
  min: 1.0
  max: 5.0
  levels:
    5.0: "Optimizado (Nivel 5) - Estado del arte, mejora continua automatizada"
    4.0: "Gestionado (Nivel 4) - Estable, documentado, medido y automatizado"
    3.0: "En Desarrollo (Nivel 3) - Definido y funcional con brechas parciales"
    2.0: "Básico (Nivel 2) - Informal, ad-hoc, dependiente de individuos"
    1.0: "Crítico (Nivel 1) - Inexistente o gravemente deficiente"

profiles:
  general_saas:
    name: "SaaS / Plataforma Core General"
    weights:
      D1: 0.15 # Arquitectura e Integración
      D2: 0.15 # Código y Mantenibilidad
      D3: 0.15 # Seguridad y DevSecOps
      D4: 0.15 # Base de Datos y Datos
      D5: 0.10 # Calidad y QA
      D6: 0.10 # DevOps e Infraestructura
      D7: 0.10 # Observabilidad y Resiliencia
      D8: 0.10 # Gobernanza y Riesgos

  fintech_critical:
    name: "Fintech / Misión Crítica / Alta Seguridad"
    weights:
      D1: 0.15
      D2: 0.10
      D3: 0.25 # Alta ponderación a Seguridad
      D4: 0.15
      D5: 0.10
      D6: 0.10
      D7: 0.10
      D8: 0.05

  mvp_startup:
    name: "MVP / Startup Etapa Temprana"
    weights:
      D1: 0.15
      D2: 0.20 # Enfoque en velocidad y Clean Code
      D3: 0.10
      D4: 0.10
      D5: 0.10
      D6: 0.15
      D7: 0.05
      D8: 0.05

thresholds:
  enterprise_ready: 4.5
  stable_good: 3.8
  regular_tech_debt: 3.0
  at_risk: 2.0
  critical: 1.0
