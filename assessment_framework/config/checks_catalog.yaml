# Catálogo de Checks — contrato de ejecución por check_type
# Todo check referenciado en dimensions/*.yaml DEBE estar definido aquí:
# herramienta, comando, parsing del output y mapeo umbral -> score.
# Los tiers (T1/T2/T3) y sus techos están en weights_and_thresholds.yaml
# (un pass sostenido solo por T1 = unconfirmed; ver evidence_resolution en config).
# NOTA: los campos `command` son ILUSTRATIVOS para humanos (usan pipes/redirecciones
# por legibilidad). Un runner automatizado DEBE construir argv sin shell según
# execution_model; el argv real ejecutado queda registrado en el manifest.
catalog_version: "1.2.0"

conventions:
  evidence_dir: "evidence/"        # Todo output se archiva con hash SHA-256 (ver pipeline paso de archivo)
  unknown_handling: "Si la herramienta no está disponible o el recurso no es accesible, los criterios afectados quedan en estado unknown (unknown_policy en weights_and_thresholds.yaml) — NUNCA sustituir silenciosamente por un grep, NUNCA convertir unknown en fail salvo que producir la evidencia sea el control evaluado."
  citation_format: "archivo:línea + commit SHA + nombre del archivo de evidencia"

# ------------------------------------------------------------
# CUSTODIA DE EVIDENCIA — evidence/ no puede volverse un
# repositorio de credenciales comprometidas
# ------------------------------------------------------------
evidence_custody:
  - "Redacción EN LA HERRAMIENTA, no solo en el informe: gitleaks con --redact, trufflehog sin --print-secrets. Ningún valor de secreto viaja a evidence/."
  - "evidence/ NUNCA se commitea (entrada obligatoria en .gitignore del repo evaluado y del repo del assessment)."
  - "Evidencia cifrada en reposo cuando sale de la máquina del auditor; acceso restringido al equipo del assessment."
  - "Política de retención: la evidencia se destruye al cierre del engagement salvo acuerdo contractual distinto; la destrucción se registra."
  - "Al cerrar el paso de archivo, se corre un secret-scan SOBRE evidence/ mismo — si detecta valores vivos, el archivo se regenera con redacción antes de continuar."
  - "manifest.json no contiene valores sensibles: solo rutas, hashes, herramienta+versión (digest), argv, commit objetivo, timestamps y exit codes. Cada entrada tiene un EV-id (EV-0001...) — la moneda de referencia que usan los subagentes en evidence_refs. Schema: schemas/manifest.schema.json. El manifest se firma (o como mínimo se publica su SHA-256 en el informe)."
  - "SELLADO TARDÍO: durante la recolección el manifest se registra incremental (sealed: false); el sello final (secret-scan sobre evidence/, hash total, sealed: true) ocurre DESPUÉS del fan-out y la reconciliación — nunca antes, para que la evidencia específica de dimensiones (mutation, performance, muestreos) no quede fuera. Tras el sello, evidence/ se congela read-only (chmod -R a-w) antes del scoring."

# ------------------------------------------------------------
# MODELO DE EJECUCIÓN SEGURO (requisitos normativos del runner)
# El catálogo documenta comandos legibles; un runner automatizado
# DEBE cumplir esto antes de ejecutar checks sobre repos no confiables:
# ------------------------------------------------------------
execution_model:
  - "Comandos como arrays de argumentos (argv), nunca strings interpretados por un shell."
  - "Ejecución en contenedor efímero con filesystem de solo lectura salvo evidence/."
  - "Red deshabilitada por defecto; solo los checks que la requieren (version_check, package_registry_audit) la habilitan hacia endpoints allowlisted."
  - "Timeouts y límites de CPU/memoria por check; captura de exit code, stdout y stderr en el manifest."
  - "Credenciales cloud read-only y de alcance mínimo; jamás credenciales de escritura."
  - "SEGREGACIÓN DE CREDENCIALES: los checks autenticados (gh api, prowler, APIs cloud) los ejecuta SOLO el orquestador; los subagentes de dimensión no reciben tokens de ninguna clase — consumen los outputs ya archivados en evidence/."
  - "Allowlist de herramientas con versiones y reglas PINNEADAS por digest — semgrep --config auto, npx de paquetes sin versión y reglas remotas mutables NO son reproducibles: se fija versión de herramienta y versión/commit del ruleset, y ambos se registran en manifest.json. Preferir imágenes de contenedor con herramientas preinstaladas y pinneadas; si se usa npx, siempre npx --no-install sobre dependencias ya declaradas."

checks:

  # ==================== TIER 1 — SEÑALES ====================
  grep_search:
    tier: T1
    tool: "ripgrep (rg) o grep -rn"
    contract: "Detecta PRESENCIA de strings. Solo válido como señal orientativa o para detectar anti-patrones puntuales (ej. expect(true).toBe(true)). Jamás confirma una práctica positiva por sí solo."
    output: "Lista de coincidencias archivo:línea"
    scoring: "T1: puede DEMOSTRAR un fail (la presencia del anti-patrón citado es la evidencia); un pass sostenido solo por este check queda unconfirmed (evidence_resolution)."

  file_exists:
    tier: T1
    tool: "find / glob"
    contract: "Detecta existencia de archivos de configuración o artefactos. La existencia de un archivo NO prueba su uso (ej. .eslintrc presente pero lint no corre en CI)."
    output: "Lista de rutas encontradas"
    scoring: "T1: un pass sostenido solo por existencia de archivos queda unconfirmed — para confirmar, combinar con el check T2 que pruebe uso real (ej. ci_config_analysis)."

  directory_structure_analysis:
    tier: T1
    tool: "tree -d -L 3 / listado de paquetes"
    contract: "Mapea la estructura de módulos/capas como insumo para architecture_conformance_review (T3). No puntúa solo."
    output: "Árbol de directorios + conteo de módulos"

  # ==================== TIER 2 — MÉTRICAS DE HERRAMIENTA ====================
  secret_scan:
    tier: T2
    tool: "gitleaks (obligatorio) + trufflehog (verificación de credencial viva, opcional)"
    command: "gitleaks git --redact --report-format json --report-path evidence/gitleaks.json .   # escanea TODO el historial, no solo HEAD; --redact evita que el secreto real llegue a evidence/"
    parsing: "JSON: cada finding con RuleID, File, Commit, Secret (SIEMPRE redactado — ver evidence_custody)"
    score_mapping:
      - "1+ secreto VIVO verificado (trufflehog) => 1.0 + hallazgo Crítico"
      - "1+ secreto en historial (no verificado vivo) => 2.0 max + hallazgo Alto"
      - "0 hallazgos y escaneo anti-secretos en CI => elegible 5.0"
    notes: "El hallazgo más frecuente vive en el HISTORIAL de git (secreto borrado del HEAD). Escanear working tree solamente invalida el check."

  sast_scan:
    tier: T2
    tool: "semgrep"
    command: "semgrep scan --config <ruleset pinneado por versión/commit> --json -o evidence/semgrep.json src/   # --config auto NO es reproducible: fijar ruleset y registrar su versión en manifest.json"
    parsing: "JSON results[]: check_id, path, start.line, severity"
    score_mapping:
      - "1+ finding ERROR en categoría injection/crypto => <= 2.0"
      - "Solo WARNING => <= 3.5"
      - "Limpio + semgrep en CI => elegible 5.0"
    notes: "Reemplaza los regex multilínea imposibles en grep (async sin catch, SQL concatenado). Usar reglas p/ del lenguaje del repo."

  sca_scan:
    tier: T2
    tool: "trivy fs u osv-scanner (incluye licencias)"
    command: "trivy fs --scanners vuln,license --format json -o evidence/trivy.json ."
    parsing: "Vulnerabilities[]: Severity, PkgName, InstalledVersion, FixedVersion; Licenses[]: categoría"
    score_mapping:
      - "CVE CRITICAL con fix disponible sin aplicar => <= 2.0 + hallazgo Alto"
      - "Solo HIGH/MEDIUM gestionados => 3.5"
      - "Limpio + SCA en CI con bloqueo + SBOM => elegible 5.0"
    license_rules: "Copyleft fuerte NO es hallazgo automático: se contrasta contra la política de licencias del cliente y el modo de uso. AGPL en dependencia de un servicio de red => prioridad máxima de revisión legal (la obligación aplica aun sin distribuir binarios); GPL => depende de si hay distribución y de cómo se enlaza. El hallazgo se emite como 'requiere revisión legal contextual' con severidad según exposición — nunca como veredicto legal del auditor técnico. Reportar inventario completo de licencias en evidence/."

  duplication_scan:
    tier: T2
    tool: "jscpd"
    command: "jscpd --reporters json --output evidence/ src/"
    parsing: "statistics.total.percentage"
    score_mapping:
      - "> 15% duplicación => 1.0"
      - "8-15% => 2.0"
      - "3-8% => 3.5"
      - "< 3% => elegible 5.0"

  complexity_scan:
    tier: T2
    tool: "lizard (multi-lenguaje) o radon (Python)"
    command: "lizard -l <lang> --csv src/ > evidence/lizard.csv"
    parsing: "CSV: NLOC, CCN, token, param por función"
    score_mapping:
      - "Funciones con CCN > 15 en > 5% del codebase => <= 2.0"
      - "CCN promedio 5-10 => 3.5"
      - "CCN promedio < 5 y sin funciones > 15 => elegible 5.0"

  dependency_graph_analysis:
    tier: T2
    tool: "madge (JS/TS), deptrac (PHP), ArchUnit (JVM), import-linter (Python)"
    command: "madge --circular --json src/ > evidence/madge.json"
    parsing: "Array de ciclos detectados; grafo de dependencias entre módulos"
    score_mapping:
      - "1+ dependencia circular entre módulos de dominio => <= 2.0"
      - "Ciclos solo en utilidades/hojas => 3.5"
      - "0 ciclos + capas respetadas (validado con architecture_conformance_review) => elegible 5.0"

  version_check:
    tier: T2
    tool: "endoflife.date API"
    command: "curl -s https://endoflife.date/api/<producto>.json  # contrastar contra versiones en package.json, Dockerfile, go.mod, etc."
    parsing: "Campos eol, latest, support por ciclo de release"
    score_mapping:
      - "1+ runtime/framework core en EOL => 1.0 + hallazgo Alto"
      - "Soportado pero a 1 major de EOL sin plan => 2.0"
      - "Versiones LTS vigentes => 3.5-5.0 según automatización de upgrades"

  package_registry_audit:
    tier: T2
    tool: "osv-scanner + API de npm/PyPI"
    command: "Por cada dependencia directa: GET https://registry.npmjs.org/<pkg> (o PyPI JSON API). Verificar: existe, fecha de publicación, descargas semanales, repositorio enlazado."
    parsing: "Paquete inexistente => alucinado. Paquete < 90 días con < 500 descargas y nombre similar a uno popular => sospecha de slopsquatting/typosquatting."
    score_mapping:
      - "1+ dependencia inexistente o típicamente slopsquatted => 1.0 + hallazgo Crítico"
      - "Todas verificadas, sin lockfile estricto => 3.5"
      - "Verificadas + lockfile + allowlist/registro privado => elegible 5.0"

  git_history_analysis:
    tier: T2
    tool: "git"
    command: "git shortlog -sn --no-merges -- <path>   # por componente crítico, últimos 12 meses: --since='12 months ago'"
    parsing: "Distribución de commits por autor y por path"
    score_mapping:
      - "1 autor concentra > 80% de commits en componente core => bus factor 1 => <= 2.0 + hallazgo Alto"
      - "2 autores activos por componente => 3.5"
      - "3+ autores con distribución sana => elegible 5.0"

  git_pr_review_analysis:
    tier: T2
    tool: "gh CLI"
    command: "gh pr list --state merged --limit 100 --json number,reviews,author,additions,mergedAt > evidence/prs.json"
    parsing: "% de PRs con 1+ review aprobada de autor distinto; tamaño mediano de PR; PRs auto-mergeados"
    score_mapping:
      - "PRs fusionados sin ninguna revisión de terceros => <= 2.0"
      - "Review habitual pero sin enforcement => 3.5"
      - "Two-party review OBLIGATORIA por branch protection (SLSA Source Track L4) => elegible 5.0"

  pipeline_history_analysis:
    tier: T2
    tool: "gh CLI / API del CI"
    command: "gh run list --limit 200 --json status,conclusion,createdAt,updatedAt,headBranch > evidence/ci_runs.json ; gh api repos/{owner}/{repo}/deployments"
    parsing: "Frecuencia de deploy, lead time (commit->deploy), tasa de runs fallidos en rama principal, tiempo de recuperación"
    score_mapping: "Mapear contra benchmarks DORA 2024 (ver D6.2). Sin acceso al historial => unknown (unknown_policy) — no se estima."

  ci_config_analysis:
    tier: T2
    tool: "Lectura estructurada de workflows + branch protection API"
    command: "gh api repos/{owner}/{repo}/branches/<main>/protection > evidence/branch_protection.json"
    parsing: "required_status_checks, required_pull_request_reviews, enforce_admins"
    score_mapping:
      - "Sin protección de rama principal => <= 2.0"
      - "Checks requeridos sin review obligatoria => 3.5"
      - "Checks + review + sin bypass de admins => elegible 5.0"

  mutation_testing:
    tier: T2
    tool: "Stryker (JS/TS), PITest (JVM), mutmut (Python)"
    command: "npx --no-install stryker run --reporters json  # stryker ya declarado y pinneado en el repo o imagen preinstalada; solo sobre módulos de negocio, acotado por tiempo; versión registrada en manifest.json"
    parsing: "Mutation score (% mutantes muertos)"
    score_mapping:
      - "Mutation score < 30% con cobertura declarada > 70% => pruebas fantasma probables => <= 2.0"
      - "50-70% => 3.5"
      - "> 70% y corriendo en CI => elegible 5.0"

  cloud_posture_scan:
    tier: T2
    tool: "Prowler (AWS/GCP/Azure) o tfsec/checkov sobre IaC si no hay acceso a consola"
    command: "prowler aws -M json-ocsf -o evidence/  # o: checkov -d infra/ -o json > evidence/checkov.json"
    parsing: "Findings por severidad mapeados a CIS Benchmark IDs"
    score_mapping:
      - "1+ FAIL crítico CIS (S3 público, 0.0.0.0/0 en admin, wildcard IAM) => <= 2.0 + hallazgo Crítico/Alto"
      - "FAILs medios gestionados => 3.5"
      - "Limpio + scan periódico automatizado => elegible 5.0"
    notes: "Sin acceso a la cuenta cloud NI a IaC => unknown en sub-dimensión crítica: confidence low, PHS provisional y dictamen de alta confianza bloqueado (unknown_policy) — no se afirma inseguridad sin evidencia."

  performance_test_analysis:
    tier: T2
    tool: "Detección + lectura de resultados de k6/Gatling/JMeter/artillery"
    command: "Buscar configs y resultados; si existen, leer umbrales (thresholds) y última ejecución"
    parsing: "Existencia de escenarios de carga + umbrales definidos + ejecución reciente/CI"
    score_mapping:
      - "Sin ninguna prueba de carga => <= 2.0 en D5.5"
      - "Escenarios definidos, ejecución manual esporádica => 3.5"
      - "Load tests con thresholds en CI/pre-release => elegible 5.0"

  # ==================== TIER 3 — JUICIO CON EVIDENCIA ====================
  architecture_conformance_review:
    tier: T3
    contract: "El agente CONTRASTA lo declarado (docs/ADRs/diagramas) contra el código real: bounded contexts, dirección de dependencias, separación de capas. Un README que dice 'hexagonal' NO puntúa como hexagonal — puntúa lo que el código demuestra."
    inputs: ["directory_structure_analysis", "dependency_graph_analysis", "lectura de 5+ módulos representativos"]
    output: "Veredicto por criterio NPLF con citas archivo:línea obligatorias"
    score_mapping: "Elegible 1.0-5.0. Sin citas archivo:línea, el veredicto es inválido."

  code_judgment_review:
    tier: T3
    contract: "Lectura real de una muestra representativa de código (mínimo 10 archivos o 5% del codebase, lo que sea mayor) para evaluar diseño, SOLID, manejo de errores o calidad de tests. Complementa (no reemplaza) los checks T2."
    output: "Veredicto por criterio NPLF con citas archivo:línea obligatorias"

  ai_attribution_analysis:
    tier: T2
    tool: "git log + política del repo"
    command: "git log --grep='Co-Authored-By:.*[Cc]laude\\|Co-Authored-By:.*[Cc]opilot\\|Generated with' --oneline | wc -l ; revisar AGENTS.md / CLAUDE.md / etiquetas de PR"
    parsing: "% de commits con trailer de atribución IA; existencia de política de atribución"
    score_mapping:
      - "Sin ningún mecanismo de atribución => DAI.0 puntúa bajo (ese ES el hallazgo); DAI.2-DAI.4 quedan unknown con pesos redistribuidos — NUNCA se asume que el código reciente es de IA"
      - "Trailers parciales => 3.5"
      - "Política escrita + trailers/etiquetas consistentes => elegible 5.0"
    notes: "Este check define el UNIVERSO de código que evalúan DAI.2-DAI.4 (regla anti doble conteo con D2). DAI.1 (dependencias) y DAI.5 (gobernanza de proceso) se evalúan aunque no haya atribución: operan sobre el repo y el proceso, no sobre código atribuido."

  llm_feature_security_review:
    tier: T3
    contract: "Solo si la plataforma integra LLMs en runtime. Revisar contra OWASP LLM Top 10 (edición 2025, numeración oficial): LLM01 Prompt Injection (¿input de usuario concatenado a prompts de sistema?), LLM02 Sensitive Information Disclosure (¿PII/secretos expuestos en prompts o respuestas?), LLM05 Improper Output Handling (¿output del LLM ejecutado/renderizado/persistido sin sanitizar?), LLM06 Excessive Agency (¿las tools/acciones que el LLM puede disparar tienen autorización propia y alcance mínimo?)."
    output: "Veredicto por criterio con citas archivo:línea"
    notes: "Si la plataforma NO usa LLMs en runtime, DAI.6 se marca N/A y su peso se redistribuye proporcionalmente (no cuenta como unknown)."

  git_branch_protection_api:
    tier: T2
    tool: "gh CLI / API de GitHub-GitLab"
    command: "gh api repos/{owner}/{repo}/branches/<main>/protection > evidence/branch_protection.json"
    parsing: "required_status_checks, required_pull_request_reviews (required_approving_review_count), enforce_admins, allow_force_pushes, allow_deletions"
    score_mapping:
      - "Sin protección de rama principal, o force push permitido => <= 2.0 (activa gating en D9.1)"
      - "PRs requeridos sin required reviews ni enforce_admins => 3.5"
      - "Checks + review requerida + enforce_admins + sin force push => elegible 5.0"
    notes: "Es la evidencia dura de D9.1. Sin permisos para leer la protección => unknown, no fail."

  git_commit_log_analysis:
    tier: T2
    tool: "git"
    command: "git log -n 200 --no-merges --pretty=format:'%h|%s' > evidence/commit_log.txt"
    parsing: "% de commits que cumplen Conventional Commits (^(feat|fix|docs|style|refactor|test|chore)(\\(.+\\))?:) y % con referencia a ticket (patrón del tracker del cliente)"
    score_mapping:
      - "< 30% de commits trazables => <= 2.0"
      - "30-80% trazables => 3.5"
      - "> 80% trazables + releases etiquetados enlazando deploys => elegible 5.0"
