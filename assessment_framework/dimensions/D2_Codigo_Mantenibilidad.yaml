dimension_id: "D2"
name: "Código Fuente y Mantenibilidad"
description: "Evaluación de Clean Code, complejidad ciclomática, principios SOLID y manejo de errores"
scope_note: "D2 califica el CODEBASE COMPLETO. Los defectos en código con atribución IA se registran en DAI y se citan aquí solo como contexto (regla anti doble conteo en weights_and_thresholds.yaml)."
standards_reference:
  - "ISO/IEC 25010:2023 SQuaRE — característica de Mantenibilidad"
  - "ISO/IEC 5055:2021 — 139 debilidades CWE medibles de calidad estructural"
  - "Clean Code: A Handbook of Agile Software Craftsmanship"
  - "SonarQube Rules and Quality Gates"
  - "SOLID Principles"

sub_dimensions:
  - id: "D2.1"
    name: "Estándares de Código y Modismos"
    weight: 0.25
    control_refs: ["ISO/IEC 25010:2023 (Analysability)"]
    agent_checks:
      - check_ref: "file_exists"
        patterns: [".eslintrc*", "eslint.config.*", ".prettierrc*", "phpcs.xml", ".rubocop.yml", "pylintrc", "ruff.toml", "biome.json"]
      - check_ref: "ci_config_analysis"
        note: "Un linter configurado pero ausente del CI no supera 3.0 (techo T1 de file_exists)"
      - check_ref: "grep_search"
        query: "console.log|print_r|var_dump|System.out.println"
        paths: ["src/"]
    nplf_criteria:
      - "Existe configuración de linter y formateador para el stack principal"
      - "El lint corre como gate obligatorio en CI (evidencia: workflow + branch protection)"
      - "No hay logs de depuración abandonados en código de producción"
      - "La convención de nombres es consistente en el muestreo T3"
    rubric:
      1.0: "Sin herramientas de linting ni formato; código inconsistente y con logs de depuración abandonados"
      2.0: "Linter presente pero desactualizado o con la mitad de reglas deshabilitadas"
      3.0: "Configuración de linter presente pero no aplicada en CI; formato mayoritariamente limpio"
      4.0: "Lint y formato en CI; excepciones puntuales justificadas con inline-disable comentado"
      5.0: "Linting y formatting automatizados y obligatorios en CI con cero tolerancias"

  - id: "D2.2"
    name: "Deuda Técnica Estructural y Complejidad"
    weight: 0.25
    control_refs: ["ISO/IEC 5055:2021 (Maintainability weaknesses)", "ISO/IEC 25010:2023 (Modifiability)"]
    agent_checks:
      - check_ref: "complexity_scan"      # T2 — lizard/radon
      - check_ref: "duplication_scan"     # T2 — jscpd
      - check_ref: "file_exists"
        patterns: ["sonar-project.properties"]
    nplf_criteria:
      - "Complejidad ciclomática promedio < 10 y sin funciones > 15 (evidencia: lizard/radon)"
      - "Duplicación total < 8% (evidencia: jscpd)"
      - "No existen archivos > 1000 líneas con lógica de negocio (Clases Dios)"
      - "La deuda estructural se mide de forma recurrente (herramienta en CI o corte trimestral)"
    rubric:
      1.0: "Presencia de Clases Dios (> 1000 líneas), complejidad ciclomática > 15 y alta duplicación"
      2.0: "Varias funciones > 15 de complejidad y duplicación 8-15%"
      3.0: "Clases de tamaño moderado, métodos extensos puntuales y baja duplicación"
      4.0: "Complejidad promedio < 10, duplicación < 5%, medición recurrente"
      5.0: "Funciones pequeñas (< 30 líneas), complejidad < 5 y duplicación < 3% con gate en CI"

  - id: "D2.3"
    name: "Principios SOLID y Limpieza"
    weight: 0.25
    control_refs: ["ISO/IEC 25010:2023 (Modularity, Reusability)"]
    agent_checks:
      - check_ref: "code_judgment_review"   # T3 — SOLID se evalúa leyendo diseño, no contando keywords
        note: "Leer constructores, límites de clase y configuración IoC en una muestra representativa; el grep de 'interface|implements' es solo señal T1"
      - check_ref: "grep_search"
        query: "interface|implements|abstract class|Inject|Autowired"
        paths: ["src/"]
    nplf_criteria:
      - "Las dependencias se inyectan (constructor/factoría), no se instancian dentro de la lógica de negocio"
      - "Las clases/módulos del muestreo tienen una única responsabilidad identificable"
      - "Las abstracciones existen donde hay variación real (no interfaces ceremoniales vacías)"
      - "No hay singletons globales mutables en el flujo de negocio"
    rubric:
      1.0: "Código fuertemente acoplado, uso masivo de singletons globales o código monolítico sin interfaces"
      2.0: "Abstracciones ocasionales; instanciación directa dominante en servicios"
      3.0: "Interfaces utilizadas en capas principales; desacoplamiento parcial"
      4.0: "Inyección de dependencias consistente; violaciones puntuales identificadas"
      5.0: "Inyección de dependencias estricta, alta cohesión y respeto de SOLID verificado en muestreo"

  - id: "D2.4"
    name: "Manejo de Errores y Excepciones"
    weight: 0.25
    control_refs: ["ISO/IEC 5055:2021 (Reliability weaknesses CWE-390/391)", "OWASP ASVS 5.0 V16 (Error Handling & Logging)"]
    agent_checks:
      - check_ref: "sast_scan"    # T2 — semgrep detecta catch vacíos y async sin manejo de forma sintáctica
        note: "Reglas: catch vacío, promesas sin catch, excepción tragada sin log — el grep por línea NO detecta bloques multilínea"
      - check_ref: "grep_search"
        query: "printStackTrace|catch\\s*\\(Throwable"
        paths: ["src/"]
    nplf_criteria:
      - "Cero capturas silenciosas de excepciones en flujos de negocio (evidencia: semgrep)"
      - "Existe manejador global de errores que no fuga stack traces al cliente"
      - "Los errores se registran con contexto estructurado (código de error, trace id)"
      - "Existe jerarquía de errores de dominio distinguible de errores de infraestructura"
    rubric:
      1.0: "Captura silenciosa de excepciones o fuga de stack trace sensible a clientes"
      2.0: "Errores logueados sin contexto; capturas genéricas dominantes"
      3.0: "Excepciones manejadas pero con capturas genéricas e inconsistencias"
      4.0: "Manejador global + jerarquía de dominio; inconsistencias solo en módulos legacy"
      5.0: "Jerarquía de excepciones de dominio limpia y manejador global de errores"
