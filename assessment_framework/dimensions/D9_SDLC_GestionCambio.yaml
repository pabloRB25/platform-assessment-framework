dimension_id: "D9"
name: "SDLC y Gestión del Cambio"
description: "Evaluación del proceso de desarrollo, protección de ramas, two-party code review y trazabilidad (controles alineados con SLSA v1.2 Source Track)"
standards_reference:
  - "SLSA v1.2 Source Track (Levels 1 to 4) — nota: declarar un nivel SLSA exige verificar TODOS sus requisitos (controles continuos, source provenance, VSA), no solo el control individual alineado"
  - "ISO/IEC/IEEE 12207:2017 Software Life Cycle Processes"
  - "Conventional Commits v1.0.0 Specification"
  - "ISO/IEC 27001:2022 A.8.32 (gestión del cambio)"

sub_dimensions:
  - id: "D9.1"
    name: "Branching y Protección de Ramas"
    weight: 0.30
    critical: true
    control_refs: ["SLSA v1.2 Source Track — control de protección de rama (L2+)", "ISO 27001:2022 A.8.4, A.8.32"]
    agent_checks:
      - check_ref: "git_branch_protection_api"
      - check_ref: "git_history_analysis"
        note: "Detectar pushes directos y force-pushes a la rama principal en el historial reciente"
    nplf_criteria:
      - id: "D9.1.C1"
        text: "La rama principal está protegida: sin push directo ni force push (evidencia: API de branch protection)"
        critical: true
        failure_effect: "gate"
        evidence_required: "T2"
      - id: "D9.1.C2"
        text: "Todo cambio llega a la rama principal vía Pull Request"
      - id: "D9.1.C3"
        text: "enforce_admins activo o bypass justificado y documentado"
      - id: "D9.1.C4"
        text: "Existe una estrategia de branching definida y seguida consistentemente (trunk-based o GitFlow)"
    rubric:
      1.0: "Commits directos permitidos a main sin restricciones ni branch protection"
      2.0: "Protección declarada pero con pushes directos o force-pushes visibles en el historial"
      3.0: "Branch protection activado requiriendo Pull Requests para fusionar a main"
      4.0: "Protección completa (required checks + review) con excepciones inventariadas"
      5.0: "Protección estricta reforzada vía API, firmas GPG/SSH y prohibición de bypass/force push (control alineado con SLSA Source L3+)"

  - id: "D9.2"
    name: "Calidad del Code Review (Two-Party Review)"
    weight: 0.25
    control_refs: ["SLSA v1.2 Source Track — control de two-party review (L4)", "DORA (code review como capability)"]
    agent_checks:
      - check_ref: "file_exists"
        patterns: [".github/CODEOWNERS", ".gitlab/CODEOWNERS", ".github/PULL_REQUEST_TEMPLATE.md"]
      - check_ref: "git_pr_review_analysis"
      - check_ref: "code_judgment_review"
        note: "Muestrear 5+ PRs: ¿reviews sustantivos o rubber-stamps ('LGTM' en 30 segundos)?"
    nplf_criteria:
      - id: "D9.2.C1"
        text: "Los PRs requieren aprobación de al menos un autor distinto, con enforcement de plataforma (no costumbre)"
      - id: "D9.2.C2"
        text: "El tamaño mediano de PR permite revisión real (< ~400 líneas netas)"
      - id: "D9.2.C3"
        text: "Los reviews muestran profundidad en la muestra (comentarios sustantivos, no aprobaciones instantáneas)"
      - id: "D9.2.C4"
        text: "CODEOWNERS (o equivalente) asigna revisión reforzada a módulos críticos (auth, pagos, migraciones)"
    rubric:
      1.0: "Autofusión de PRs sin revisión externa o reviews nominales sin análisis"
      2.0: "Reviews formales pero vacíos (rubber-stamp); PRs de miles de líneas"
      3.0: "Aprobación de al menos un par requerida antes de fusionar en CI"
      4.0: "Two-party review con enforcement de plataforma y reviews sustantivos"
      5.0: "Two-party review estricto (control alineado con SLSA Source L4 — declarar el nivel exige el resto de requisitos y attestations), CODEOWNERS activos y checklists de PR obligatorios"

  - id: "D9.3"
    name: "Trazabilidad Commit → Ticket → Deploy"
    weight: 0.25
    control_refs: ["Conventional Commits v1.0.0", "ISO 27001:2022 A.8.32"]
    agent_checks:
      - check_ref: "git_commit_log_analysis"
        pattern: "^(feat|fix|docs|style|refactor|test|chore)(\\(.+\\))?: .+"
    nplf_criteria:
      - id: "D9.3.C1"
        text: "Los cambios se vinculan a su motivo (ticket, issue o PR descriptivo) de forma consistente (> 80% en la muestra)"
      - id: "D9.3.C2"
        text: "Los mensajes siguen una convención parseable (Conventional Commits o equivalente)"
      - id: "D9.3.C3"
        text: "Los releases a producción quedan registrados (tags, GitHub Releases o registro de deploys)"
      - id: "D9.3.C4"
        text: "Es posible responder '¿qué cambios entraron en el deploy X?' con evidencia"
    rubric:
      1.0: "Commits con mensajes ambiguos e imposibilidad de trazar cambios a requerimientos"
      2.0: "Referencias a tickets esporádicas; sin registro de releases"
      3.0: "Mensajes con Conventional Commits e IDs de tickets presentes en la mayoría de commits"
      4.0: "Trazabilidad consistente commit->ticket + releases registrados"
      5.0: "Trazabilidad automatizada bidireccional (Commit ↔ Ticket ↔ Release ↔ Deploy) en segundos"

  - id: "D9.4"
    name: "Hotfixes y Cambios de Emergencia"
    weight: 0.20
    control_refs: ["ISO 27001:2022 A.8.32 (cambios de emergencia)", "Google SRE (postmortems)"]
    agent_checks:
      - check_ref: "file_exists"
        patterns: ["docs/hotfix_process*", "docs/postmortem*", "docs/incidents/*"]
      - check_ref: "git_history_analysis"
        note: "Identificar hotfixes en el historial (ramas hotfix/*, reverts, merges directos) y verificar si siguieron proceso"
    nplf_criteria:
      - id: "D9.4.C1"
        text: "Existe proceso definido para cambios de emergencia (quién aprueba, cómo se despliega)"
      - id: "D9.4.C2"
        text: "Los hotfixes pasan por el pipeline (aunque sea abreviado), no por deploy manual"
      - id: "D9.4.C3"
        text: "Los hotfixes se reconcilian con la rama principal (sin drift permanente)"
      - id: "D9.4.C4"
        text: "Los incidentes significativos generan postmortem con acciones en < 48h"
    rubric:
      1.0: "Cambios aplicados directamente en servidores de producción sin registro en Git"
      2.0: "Hotfixes por vías informales; reconciliación con main esporádica"
      3.0: "Flujo abreviado de hotfix por rama dedicada y CI automatizado"
      4.0: "Proceso documentado y seguido; postmortems para incidentes mayores"
      5.0: "Proceso de Hotfix auditable con aprobación express y Postmortem obligatorio en < 48h"
