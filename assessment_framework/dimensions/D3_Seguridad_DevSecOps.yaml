dimension_id: "D3"
name: "Seguridad Aplicativa y DevSecOps"
description: "Evaluación de vulnerabilidades de código, gestión de secretos, autenticación, seguridad de APIs en runtime y cadena de suministro"
standards_reference:
  - "OWASP Software Assurance Maturity Model (SAMM) v2.1.0"
  - "OWASP Application Security Verification Standard (ASVS) 5.0.0"
  - "OWASP Top 10:2025 (A03 = Software Supply Chain Failures)"
  - "OWASP API Security Top 10 (2023)"
  - "SLSA v1.2 — Build Track (L0-L3) y Source Track (L1-L4)"
  - "ISO/IEC 27001:2022 Anexo A (controles 8.25-8.34 desarrollo seguro)"

sub_dimensions:
  - id: "D3.1"
    name: "Autenticación y Autorización"
    weight: 0.20
    critical: true
    control_refs: ["ASVS 5.0 V6 (Authentication)", "ASVS 5.0 V8 (Authorization)", "ASVS 5.0 V9 (Tokens)", "ASVS 5.0 V10 (OAuth/OIDC)", "ISO 27001:2022 A.5.15-A.5.18"]
    agent_checks:
      - check_ref: "sast_scan"
        note: "Reglas de crypto débil (MD5/SHA1 para passwords), JWT sin verificación de firma, eval"
      - check_ref: "code_judgment_review"
        note: "Leer el middleware/guard real de autorización: ¿se verifica en cada endpoint o por convención frágil?"
    nplf_criteria:
      - id: "D3.1.C1"
        text: "Contraseñas hasheadas con algoritmo vigente (bcrypt/argon2/scrypt) — nunca MD5/SHA1"
      - id: "D3.1.C2"
        text: "Tokens con expiración corta, firma verificada y estrategia de rotación/revocación"
      - id: "D3.1.C3"
        text: "La autorización se aplica de forma centralizada y verificable en cada endpoint protegido"
      - id: "D3.1.C4"
        text: "Flujos OAuth/OIDC siguen el estándar (PKCE en públicos, state, validación de redirect_uri)"
      - id: "D3.1.C5"
        text: "Principio de mínimo privilegio en roles de aplicación"
    rubric:
      1.0: "Algoritmos criptográficos obsoletos (MD5/SHA1), JWT sin firma o falta de comprobación de permisos"
      2.0: "Auth estándar pero con brechas verificables (tokens sin expiración, roles hardcodeados)"
      3.0: "BCrypt/Argon2 y JWT con expiración adecuada; RBAC implementado pero con brechas menores"
      4.0: "OAuth2/OIDC estándar con rotación de tokens; autorización centralizada"
      5.0: "OAuth2/OIDC estándar, rotación de tokens, mTLS y control ABAC/RBAC estricto"

  - id: "D3.2"
    name: "Gestión de Secretos y Credenciales"
    weight: 0.20
    critical: true
    control_refs: ["ASVS 5.0 V14 (Configuration)", "ISO 27001:2022 A.8.24", "CIS Benchmarks (secrets management)"]
    agent_checks:
      - check_ref: "secret_scan"
        note: "gitleaks sobre TODO el historial de git (no solo HEAD) + verificación de credencial viva con trufflehog. Los 4 regex anteriores quedan obsoletos: el catálogo exige el set completo de reglas + entropía"
      - check_ref: "file_exists"
        patterns: [".gitleaks.toml", ".trufflehog.yaml", ".pre-commit-config.yaml"]
    nplf_criteria:
      - id: "D3.2.C1"
        text: "No existen secretos VIVOS (verificación de credencial activa con trufflehog sobre los hallazgos de gitleaks)"
        critical: true
        failure_effect: "gate"
        evidence_required: "T2"
      - id: "D3.2.C2"
        text: "Cero secretos en el historial completo de git (evidencia: gitleaks JSON redactado y archivado)"
      - id: "D3.2.C3"
        text: "Si hubo secretos históricos: están rotados y hay evidencia de la rotación"
      - id: "D3.2.C4"
        text: "Los secretos de runtime viven en un gestor (Vault/Secrets Manager/parameter store), no en .env commiteados"
      - id: "D3.2.C5"
        text: "Escaneo anti-secretos automatizado (pre-commit o CI)"
      - id: "D3.2.C6"
        text: "Existe política/proceso de rotación de credenciales"
    rubric:
      1.0: "Secretos, claves API o contraseñas hardcodeadas en código fuente o en el historial de Git sin rotar"
      2.0: "Secretos históricos en git sin evidencia de rotación; .env fuera de git pero sin gestor central"
      3.0: "Variables de entorno utilizadas pero sin rotación automatizada ni uso de Key Vault"
      4.0: "Gestor de secretos en uso + escaneo anti-secretos en CI; rotación manual documentada"
      5.0: "Uso de AWS Secrets Manager / Vault, rotación automática y escaneo continuo anti-secretos"

  - id: "D3.3"
    name: "Análisis de Dependencias, Licencias y Supply Chain (SCA)"
    weight: 0.20
    control_refs: ["OWASP Top 10:2025 A03 (Software Supply Chain Failures)", "SLSA v1.2 Build Track", "ISO 27001:2022 A.8.30"]
    agent_checks:
      - check_ref: "sca_scan"
        note: "trivy/osv-scanner con escaneo de licencias incluido en la misma pasada"
      - check_ref: "file_exists"
        patterns: ["package-lock.json", "yarn.lock", "pnpm-lock.yaml", "Pipfile.lock", "poetry.lock", "go.sum", "pom.xml"]
      - check_ref: "grep_search"
        query: "dependabot|renovate|snyk|trivy"
        paths: [".github/", ".gitlab-ci.yml", "bitbucket-pipelines.yml"]
    nplf_criteria:
      - id: "D3.3.C1"
        text: "Lockfiles estrictos presentes y respetados en CI (install congelado)"
      - id: "D3.3.C2"
        text: "Cero CVEs CRITICAL con fix disponible sin aplicar (evidencia: trivy/osv JSON)"
      - id: "D3.3.C3"
        text: "SCA automatizado en CI con política de bloqueo"
      - id: "D3.3.C4"
        text: "Inventario de licencias sin copyleft fuerte (GPL/AGPL) incompatible con el modelo SaaS propietario"
      - id: "D3.3.C5"
        text: "SBOM generado o generable en el pipeline"
    rubric:
      1.0: "Dependencias obsoletas con CVEs críticos sin parchear y sin gestión de lockfiles"
      2.0: "Lockfiles presentes; CVEs altos conocidos sin plan; licencias sin inventariar"
      3.0: "Lockfiles presentes; actualizaciones de seguridad realizadas manualmente"
      4.0: "SCA en CI con alertas gestionadas; licencias inventariadas"
      5.0: "Escaneo SCA automatizado en CI/CD con bloqueo por CVEs, licencias controladas y generación de SBOM"

  - id: "D3.4"
    name: "Sanitización, Input Validation e Inyección"
    weight: 0.20
    critical: true
    control_refs: ["ASVS 5.0 V1 (Encoding & Sanitization)", "ASVS 5.0 V2 (Validation)", "ASVS 5.0 V3 (Frontend Security)", "OWASP Top 10:2025 A05 (Injection)"]
    agent_checks:
      - check_ref: "sast_scan"
        note: "Semgrep con reglas de injection del lenguaje: SQL concatenado, XSS, SSRF, deserialización — análisis sintáctico, no regex por línea"
      - check_ref: "grep_search"
        query: "zod|joi|class-validator|express-validator|helmet"
        paths: ["src/"]
    nplf_criteria:
      - id: "D3.4.C1"
        text: "Cero hallazgos ERROR de inyección en SAST (evidencia: semgrep JSON) — una inyección demostrable activa el gate directamente"
        critical: true
        failure_effect: "gate"
        evidence_required: "T2"
      - id: "D3.4.C2"
        text: "Toda entrada externa pasa por validación de esquema (Zod/Joi/class-validator o equivalente)"
      - id: "D3.4.C3"
        text: "Acceso a datos exclusivamente vía consultas parametrizadas/ORM (sin concatenación)"
      - id: "D3.4.C4"
        text: "Salidas renderizadas con escaping automático; usos de dangerouslySetInnerHTML/eval justificados y sanitizados"
      - id: "D3.4.C5"
        text: "Cabeceras de seguridad HTTP configuradas (CSP, HSTS, CORS restringido)"
    rubric:
      1.0: "Vulnerabilidades manifiestas a SQL Injection, XSS o falta total de validación de entradas"
      2.0: "ORM parcial con consultas crudas concatenadas en módulos secundarios"
      3.0: "ORM utilizado para evitar SQLi; validación básica de tipos en entradas"
      4.0: "Validación de esquema consistente + SAST limpio; cabeceras parciales"
      5.0: "Validación estricta de esquemas, sanitización integral y cabeceras HTTP de seguridad (CSP, HSTS)"

  - id: "D3.5"
    name: "Seguridad de APIs en Runtime (BOLA/BFLA)"
    weight: 0.20
    critical: true
    control_refs: ["OWASP API Security Top 10 2023 — API1 (BOLA)", "API5 (BFLA)", "ASVS 5.0 V8 (Authorization)"]
    agent_checks:
      - check_ref: "code_judgment_review"
        note: "Auditar autorización a nivel de OBJETO: tomar 5+ endpoints que reciben IDs de recurso y verificar que se compruebe la pertenencia/tenancy del recurso al usuario autenticado, no solo que esté logueado"
      - check_ref: "grep_search"
        query: "findById|findOne|params.id|req.params"
        paths: ["src/"]
        note: "T1 — localiza endpoints candidatos para la auditoría T3"
    nplf_criteria:
      - id: "D3.5.C1"
        text: "Ningún BOLA demostrable: los endpoints que reciben IDs verifican pertenencia del objeto al usuario/tenant — muestreo con citas; un acceso cruzado reproducible activa el gate directamente"
        critical: true
        failure_effect: "gate"
        evidence_required: "T3"
      - id: "D3.5.C2"
        text: "Las funciones administrativas verifican rol/permiso a nivel de función (anti-BFLA), no solo autenticación"
      - id: "D3.5.C3"
        text: "En multi-tenant: el aislamiento se aplica en la capa de datos (RLS o filtro obligatorio), no solo en el controlador"
      - id: "D3.5.C4"
        text: "Los IDs expuestos no son enumerables o hay control de acceso que hace irrelevante la enumeración"
    rubric:
      1.0: "Endpoints que devuelven cualquier objeto por ID sin comprobar pertenencia (BOLA manifiesto)"
      2.0: "Comprobación de pertenencia inconsistente entre módulos"
      3.0: "Anti-BOLA en flujos principales; funciones admin con verificación parcial"
      4.0: "Autorización a nivel de objeto y función consistente; aislamiento multi-tenant en capa de datos"
      5.0: "Autorización objeto+función centralizada y testeada, con pruebas automatizadas de control de acceso"
