dimension_id: "D1"
name: "Arquitectura e Integración"
description: "Evaluación del diseño arquitectónico, patrones de integración, APIs y resiliencia del sistema"
standards_reference:
  - "TOGAF Architecture Development Method (ADM)"
  - "SEI Architecture Tradeoff Analysis Method (ATAM)"
  - "ISO/IEC/IEEE 42010:2022 — Architecture description"
  - "ISO/IEC/IEEE 42030:2019 — Architecture evaluation framework"
  - "OpenAPI Specification v3.1"

sub_dimensions:
  - id: "D1.1"
    name: "Patrones de Arquitectura y Coherencia"
    weight: 0.30
    control_refs: ["ISO/IEC/IEEE 42010:2022", "ISO/IEC/IEEE 42030:2019 §6"]
    agent_checks:
      - check_ref: "directory_structure_analysis"   # T1 — insumo
      - check_ref: "dependency_graph_analysis"       # T2 — la dirección real de dependencias, insumo del review de conformidad
      - check_ref: "architecture_conformance_review" # T3 — la nota la da el código real, no los docs
        note: "Contrastar docs/ADRs contra el código: un README que declara 'hexagonal' no puntúa como hexagonal"
    nplf_criteria:
      - id: "D1.1.C1"
        text: "Existe un patrón arquitectónico identificable y consistente en la estructura real del código (no solo declarado en docs)"
      - id: "D1.1.C2"
        text: "La dirección de dependencias respeta las capas del patrón (validado con dependency_graph_analysis)"
      - id: "D1.1.C3"
        text: "Los documentos de arquitectura (ADRs/diagramas) coinciden con lo que el código demuestra"
      - id: "D1.1.C4"
        text: "No hay fugas de abstracción entre capas en los módulos core (muestreo T3 con citas)"
      - id: "D1.1.C5"
        text: "El patrón elegido es proporcional a la carga y dominio del negocio (sin over-engineering)"
    rubric:
      1.0: "Sin patrón definido, monolito acoplado o código espagueti"
      2.0: "Intento de modularización incompleto; capas declaradas pero rotas en la práctica"
      3.0: "Patrón modular visible pero con fugas de capas y acoplamiento temporal"
      4.0: "Patrón respetado en los módulos core; excepciones puntuales documentadas"
      5.0: "Arquitectura limpia/hexagonal/microservicios perfectamente respetada y verificada contra el grafo de dependencias"

  - id: "D1.2"
    name: "Integración y Diseño de APIs"
    weight: 0.25
    control_refs: ["OpenAPI 3.1", "OWASP ASVS 5.0 V4 (API & Web Service)"]
    agent_checks:
      - check_ref: "file_exists"
        patterns: ["*openapi*.json", "*openapi*.yaml", "*swagger*.yaml", "*.proto", "schema.graphql"]
      - check_ref: "code_judgment_review"
        note: "Verificar en código real: versionamiento efectivo, idempotencia en endpoints mutantes, rate limiting activo"
    nplf_criteria:
      - id: "D1.2.C1"
        text: "Existe contrato formal (OpenAPI/proto/GraphQL schema) y está sincronizado con los endpoints reales"
      - id: "D1.2.C2"
        text: "Las APIs públicas están versionadas y los breaking changes tienen estrategia de deprecación"
      - id: "D1.2.C3"
        text: "Los endpoints mutantes críticos implementan idempotencia"
      - id: "D1.2.C4"
        text: "Existe rate limiting/throttling en el borde (gateway o middleware)"
      - id: "D1.2.C5"
        text: "Las respuestas de error siguen un formato estándar consistente"
    rubric:
      1.0: "Sin contratos formalizados ni versionamiento de API"
      2.0: "Documentación de API parcial y desincronizada del código"
      3.0: "OpenAPI parcial, sin rate-limiting ni manejo de idempotencia"
      4.0: "Contratos versionados y sincronizados; idempotencia en flujos críticos"
      5.0: "Contratos estrictos versionados, idempotencia y gateway con throttling"

  - id: "D1.3"
    name: "Acoplamiento, Cohesión y DDD"
    weight: 0.25
    control_refs: ["ISO/IEC 25010:2023 (Maintainability - Modularity)"]
    agent_checks:
      - check_ref: "dependency_graph_analysis"   # T2 — madge/deptrac/ArchUnit/import-linter según stack
      - check_ref: "architecture_conformance_review"
        note: "Validar bounded contexts REALES: ¿los módulos comparten persistencia o modelos internos?"
    nplf_criteria:
      - id: "D1.3.C1"
        text: "Cero dependencias circulares entre módulos de dominio (evidencia: output de la herramienta de grafo)"
      - id: "D1.3.C2"
        text: "Los bounded contexts no comparten tablas/esquemas de persistencia directamente"
      - id: "D1.3.C3"
        text: "La lógica de negocio vive en el dominio, no dispersa en controladores/utilidades"
      - id: "D1.3.C4"
        text: "Un cambio en un módulo no exige recompilar/redesplegar módulos no relacionados"
    rubric:
      1.0: "Dependencias circulares y lógica de negocio dispersa"
      2.0: "Módulos nominales con ciclos frecuentes y modelos compartidos"
      3.0: "Módulos aislados pero compartiendo persistencia directamente"
      4.0: "Bounded contexts delimitados; acoplamiento residual solo en módulos legacy identificados"
      5.0: "Bounded Contexts independientes con bajo acoplamiento verificado por herramienta"

  - id: "D1.4"
    name: "Escala y Resiliencia de Diseño"
    weight: 0.20
    control_refs: ["AWS Well-Architected Reliability Pillar", "ISO/IEC 25010:2023 (Flexibility - Scalability)"]
    agent_checks:
      - check_ref: "grep_search"
        query: "circuitbreaker|retry|backoff|timeout|bulkhead"
        paths: ["src/"]
        note: "T1 — solo señal; confirmar con lectura de configuración real"
      - check_ref: "code_judgment_review"
        note: "Verificar que los timeouts/retries estén configurados en los clientes HTTP/DB reales, no solo importados"
    nplf_criteria:
      - id: "D1.4.C1"
        text: "Todas las llamadas de red salientes tienen timeout explícito configurado"
      - id: "D1.4.C2"
        text: "Los retries usan backoff exponencial con límite (no retry infinito)"
      - id: "D1.4.C3"
        text: "Existe aislamiento de fallos (circuit breaker o bulkhead) en integraciones críticas"
      - id: "D1.4.C4"
        text: "El diseño contempla degradación elegante (feature flags, fallbacks) ante caída de dependencias"
    rubric:
      1.0: "Sin tolerancias a fallos; fallos en cascada frecuentes"
      2.0: "Timeouts por defecto del framework sin configuración deliberada"
      3.0: "Timeouts y reintentos simples configurados"
      4.0: "Timeouts, retries con backoff y circuit breakers en integraciones críticas"
      5.0: "Circuit breakers, exponential backoff y degradación elegante verificados en código y probados"
